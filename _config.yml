# Site Settings
locale: "en-US"
title: "Ye Tao"
title_separator: "-"
name: "Ye Tao"
description: "Ye Tao is a Ph.D. candidate at City University of Hong Kong researching geometry-aware 3D/4D generation, articulated motion, and character animation."
url: https://davytao.me
baseurl: ""
repository: "momoyatw/momoyatw.github.io"

# SEO Related
google_site_verification:
bing_site_verification:

# Social Sharing
og_image: "avatar-2025.jpg"
og_image_alt: "Portrait of Ye Tao"
og_image_width: 1288
og_image_height: 1288
twitter_card: "summary"
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type: Person
  name: "Ye Tao"
  job_title: "Ph.D. Candidate"
  affiliation:
    name: "City University of Hong Kong"
    url: "https://www.cityu.edu.hk/"
  alumni_of:
    - name: "Beihang University"
      url: "https://ev.buaa.edu.cn/"
    - name: "Northwestern Polytechnical University"
      url: "https://en.nwpu.edu.cn/"
  knows_about:
    - "Geometry-aware 3D/4D generation"
    - "Articulated motion"
    - "Character animation"
  links:
    - "https://scholar.google.com/citations?user=NfCKsjsAAAAJ&hl=en"
    - "https://github.com/momoyatw"
    - "https://www.linkedin.com/in/ye-tao-418b30435"
    - "https://orcid.org/0009-0004-5923-0692"

# Analytics
analytics:
  provider: false

# Site Author
author:
  name: "Ye Tao"
  avatar: "avatar-2025-320.jpg"
  bio: "Ph.D. Candidate, City University of Hong Kong"
  googlescholar: "https://scholar.google.com/citations?user=NfCKsjsAAAAJ&hl=en"
  email: "ye.tao@my.cityu.edu.hk"
  github: "momoyatw"
  linkedin: "ye-tao-418b30435"
  orcid: "https://orcid.org/0009-0004-5923-0692"

# Reading Files
include:
  - _pages
  - files
exclude:
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - node_modules
  - vendor
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style

timezone: Asia/Hong_Kong

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
